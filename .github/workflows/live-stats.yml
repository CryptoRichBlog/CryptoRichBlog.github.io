name: Live stats

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the site files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

      - name: Read pool and DRep numbers (AdaStat first, Koios if AdaStat fails)
        working-directory: site
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request

          POOL = 'pool1ezmnjmu9fw36ftprczhwhvqd60syaclpp74keu0yj7rty7r3dna'
          POOL_HEX = 'c8b7396f854ba3a4ac23c0aeebb00dd3e04ee3e10fab6cf1e49786b2'
          DREP = 'drep1yfkn463gfmajw3v0nva9cds6cvzghsvv6pdgn2ywmqv684q9u7ph4'
          DREP_HEX = '6d3aea284efb27458f9b3a5c361ac3048bc18cd05a89a88ed819a3d4'
          K = 'https://api.koios.rest/api/v1/'
          A = 'https://adastat.net/api/rest/v1/'
          ADA = 1_000_000

          def fetch(url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers={
                  'Accept': 'application/json', 'Content-Type': 'application/json',
                  'User-Agent': 'crich.io live-stats (+https://crich.io)'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # 1) AdaStat: the same numbers the hourly delegator check reads.
          def from_adastat():
              p = fetch(f'{A}pools/{POOL_HEX}.json')['data']
              d = fetch(f'{A}dreps/{DREP_HEX}.json')['data']
              if p.get('ticker') != 'CRICH' or d.get('bech32') != DREP:
                  raise ValueError('AdaStat answered for a different pool or DRep')
              return {
                  'pool_live': int(p['live_stake']), 'pool_n': int(p['delegator']),
                  'blocks': int(p.get('total_block') or 0),
                  'drep_live': int(d['live_stake']), 'drep_n': int(d['delegator']),
              }

          # 2) Koios: its delegator list can lag by hours or miss accounts, so
          #    pool owners and our DRep's delegators are added and every balance
          #    is read from the account itself.
          def paged(path):
              rows, off = [], 0
              while True:
                  page = fetch(f'{K}{path}&limit=1000&offset={off}')
                  rows += page
                  if len(page) < 1000:
                      return rows
                  off += 1000

          def accounts(addrs):
              rows = []
              for i in range(0, len(addrs), 100):
                  rows += fetch(K + 'account_info', {'_stake_addresses': addrs[i:i + 100]})
              return rows

          def from_koios():
              pool = fetch(K + 'pool_info', {'_pool_bech32_ids': [POOL]})[0]
              pool_addrs = {d['stake_address'] for d in paged(f'pool_delegators?_pool_bech32={POOL}')}
              drep_addrs = {d['stake_address'] for d in paged(f'drep_delegators?_drep_id={DREP}')}
              everyone = sorted(pool_addrs | drep_addrs | set(pool.get('owners') or []))
              accts = [a for a in accounts(everyone) if a.get('status') == 'registered']
              in_pool = [a for a in accts if a.get('delegated_pool') == POOL]
              in_drep = [a for a in accts if a.get('delegated_drep') == DREP]
              return {
                  'pool_live': sum(int(a.get('total_balance') or 0) for a in in_pool),
                  'pool_n': len(in_pool), 'blocks': int(pool.get('block_count') or 0),
                  'drep_live': sum(int(a.get('total_balance') or 0) for a in in_drep),
                  'drep_n': len(in_drep),
              }

          got, source = None, None
          for name, fn in (('AdaStat', from_adastat), ('Koios', from_koios)):
              try:
                  n = fn()
                  if n['pool_live'] > 0 and n['drep_live'] > 0:
                      got, source = n, name
                      break
                  print(f'::warning::{name} returned zero')
              except Exception as e:
                  print(f'::warning::{name} failed ({e})')
          if not got:
              print('::warning::No source answered, stats.json left as it was')
              sys.exit(0)

          try:
              epoch = fetch(K + 'tip')[0].get('epoch_no')
          except Exception:
              epoch = None

          out = {
              'epoch': epoch,
              'pool': {
                  'live_stake': round(got['pool_live'] / ADA),
                  'delegators': got['pool_n'],
                  'blocks': got['blocks'],
              },
              'drep': {
                  'live_stake': round(got['drep_live'] / ADA),
                  'delegators': got['drep_n'],
              },
              'source': f'{source}, checked hourly',
          }
          with open('stats.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')
          print(json.dumps(out, indent=2))
          PY

      - name: Save stats.json if a number changed
        working-directory: site
        run: |
          if [ ! -f stats.json ]; then
            echo "No stats.json yet."
            exit 0
          fi
          git add stats.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Live stats ($(python3 -c 'import json; d=json.load(open("stats.json")); print(d["source"].split(",")[0], "epoch", d["epoch"])'))"
          git push
