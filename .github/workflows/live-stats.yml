name: Live stats

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the site files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

      - name: Read pool and DRep numbers from Koios
        working-directory: site
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request

          K = 'https://api.koios.rest/api/v1/'
          POOL = 'pool1ezmnjmu9fw36ftprczhwhvqd60syaclpp74keu0yj7rty7r3dna'
          DREP = 'drep1yfkn463gfmajw3v0nva9cds6cvzghsvv6pdgn2ywmqv684q9u7ph4'
          ADA = 1_000_000

          def call(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(K + path, data=data, headers={
                  'Accept': 'application/json', 'Content-Type': 'application/json',
                  'User-Agent': 'crich.io live-stats'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def paged(path):
              rows, off = [], 0
              while True:
                  page = call(f'{path}&limit=1000&offset={off}')
                  rows += page
                  if len(page) < 1000:
                      return rows
                  off += 1000

          def accounts(addrs):
              rows = []
              for i in range(0, len(addrs), 100):
                  rows += call('account_info', {'_stake_addresses': addrs[i:i + 100]})
              return rows

          try:
              tip = call('tip')[0]
              pool = call('pool_info', {'_pool_bech32_ids': [POOL]})[0]
              pool_addrs = {d['stake_address'] for d in paged(f'pool_delegators?_pool_bech32={POOL}')}
              pool_addrs |= set(pool.get('owners') or [])
              pool_accts = [a for a in accounts(sorted(pool_addrs))
                            if a.get('status') == 'registered' and a.get('delegated_pool') == POOL]
              drep_addrs = {d['stake_address'] for d in paged(f'drep_delegators?_drep_id={DREP}')}
              drep_accts = [a for a in accounts(sorted(drep_addrs))
                            if a.get('status') == 'registered' and a.get('delegated_drep') == DREP]
              drep = call('drep_info', {'_drep_ids': [DREP]})[0]
          except Exception as e:
              print(f'::warning::Koios did not answer, stats.json left as it was ({e})')
              sys.exit(0)

          pool_live = sum(int(a.get('total_balance') or 0) for a in pool_accts)
          drep_live = sum(int(a.get('total_balance') or 0) for a in drep_accts)
          if pool_live <= 0 or drep_live <= 0:
              print('::warning::Koios returned zero, stats.json left as it was')
              sys.exit(0)

          out = {
              'epoch': tip.get('epoch_no'),
              'pool': {
                  'live_stake': round(pool_live / ADA),
                  'delegators': len(pool_accts),
                  'blocks': pool.get('block_count'),
              },
              'drep': {
                  'live_stake': round(drep_live / ADA),
                  'delegators': len(drep_accts),
                  'voting_power_this_epoch': round(int(drep.get('amount') or 0) / ADA),
              },
              'source': 'Koios (api.koios.rest), checked hourly',
          }
          with open('stats.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')
          print(json.dumps(out, indent=2))
          PY

      - name: Save stats.json if a number changed
        working-directory: site
        run: |
          if [ ! -f stats.json ]; then
            echo "No stats.json yet."
            exit 0
          fi
          git add stats.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Live stats (epoch $(python3 -c 'import json; print(json.load(open("stats.json"))["epoch"])'))"
          git push
